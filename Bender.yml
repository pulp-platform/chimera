package:
  name: chimera
  authors:
    - "Moritz Scherer <scheremo@iis.ee.ethz.ch>"
    - "Lorenzo Leone <lleone@iis.ee.ethz.ch>"

dependencies:
  register_interface:       { git: "https://github.com/pulp-platform/register_interface.git", version: 0.4.7 }
  axi:                      { git: "https://github.com/colluca/axi",                          rev: 0df61e9b7c3e7cd62bf8fb7388a3089908e71f89 } # multicast branch
  cheshire:                 { git: "https://github.com/pulp-platform/cheshire.git",           rev: 7e5796c96f03819c8293ac4bb55cfcff481677f5 } # wiesep/chimera-pulp-v2.0.0 branch
  snitch_cluster:           { git: "https://github.com/pulp-platform/snitch_cluster.git",     rev: 5b2fccd96c42812774c20ab2f9b811e164809789 } # main branch
  common_cells:             { git: "https://github.com/pulp-platform/common_cells.git",       version: 1.39.0 }
  idma:                     { git: "https://github.com/pulp-platform/iDMA.git",               version: 0.6.5 }
  memory_island:            { git: "https://github.com/pulp-platform/memory_island.git",      rev: d072ba0945adad5ccd0af2d4604abe57c1058252 } # main branch
  apb:                      { git: "https://github.com/pulp-platform/apb.git",                version: 0.2.4 }
  hyperbus:                 { git: "https://github.com/pulp-platform/hyperbus.git",           rev: 2a14bd8f9a985b488ee23d240764f52f129f7729 } # aottaviano/nonfree branch
  tech_cells_generic:       { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.12 }

export_include_dirs:
  - hw/include

sources:
  # Level 0
  - hw/chimera_pkg.sv
  - hw/regs/chimera_reg_pkg.sv
  - hw/regs/chimera_reg_top.sv
  - hw/bootrom/snitch/snitch_bootrom.sv
  - hw/narrow_adapter.sv
  - hw/chimera_cluster_adapter.sv
  - hw/apb_dump_msg.sv

  # List of clusters
  - hw/clusters/chimera_cluster.sv

  # Top Level Domains
  - hw/chimera_clu_domain.sv
  - hw/chimera_memisland_domain.sv
  - hw/hyperbus_wrap.sv

  # Top Level
  - hw/chimera_top_wrapper.sv

  - target: any(simulation, test)
    files:
      - target/sim/models/s27ks0641/s27ks0641.v
      - target/sim/src/tb_chimera_pkg.sv
      - target/sim/src/vip_chimera_soc.sv
      - target/sim/src/fixture_chimera_soc.sv
      - target/sim/src/tb_chimera_soc.sv

vendor_package:
  - name: reggen
    target_dir: "utils"
    upstream: { git: "https://github.com/pulp-platform/register_interface.git", rev: "19163bb5191d2669a8cbc267cdd4ce8e60f20746"}
    mapping:
      - { from: 'vendor/lowrisc_opentitan/util', to: 'reggen'}
