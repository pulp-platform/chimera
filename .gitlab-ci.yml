variables:
  # Enable colors in CI terminal
  TERM: ansi
  FORCE_COLOR: 1
  VSIM_TESTS: '["testCluster", "testClusterOffload", "testMemBypass", "testPeripheralsGating", "testHyperbusAddr", "testCfgBootAddr"]'
  BINARY_DIR: ./sw/tests

default:
  before_script:
      # Install python virtual environment
    - source iis-env.sh
      # Set up environment
    - export PATH=$RISCV_GCC_BINROOT:$PATH
    - env

stages:
  - build
  - test

.base:
  artifacts:
    when: always
    expire_in: 1 week

vsim-build:
  extends: .base
  stage: build
  script:
    # Checkout dependencies
    - bender checkout
    # Build hardware
    - make chs-hw-init
    - make sn-hw-all
    # Build Chimera SW
    - make chim-sw
    # Build Chimera Bootrom
    - make chim-bootrom-init
    # Compile SoC in vsim
    - make chim-sim
  artifacts:
    paths: [ "hw", "sw", "target/sim" ]
    expire_in: 3 days

vsim-test:
  extends: .base
  stage: test
  needs: [ vsim-build ]
  parallel:
    matrix:
      - TESTNAME: ${VSIM_TESTS}
  script:
    - make chim-run-batch BINARY=$BINARY_DIR/$TESTNAME.memisl.elf VSIM_FLAGS="-l $TESTNAME.transcript"
    - ./scripts/vsim_ret_error.sh $TESTNAME.transcript
  dependencies:
    - vsim-build
  artifacts:
    paths: [ "hw", "sw", "target/sim" ]
    exclude: [ "target/sim/vsim/work/**/*", "target/sim/vsim/work" ]
    expire_in: 4 weeks
