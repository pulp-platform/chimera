[build-system]
requires = ["setuptools==68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "1.0.0"
description = "A Flexible Multi-Accelerator Framework for Heterogeneous SoC Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lorenzo Leone", email = "lleone@iis.ee.ethz.ch" }]

dependencies = [
  "hjson",
  "tabulate",
  "pyyaml",
  "mako",
  "jsonref",
  "jsonschema",
  "flatdict",
  "json5",
  "peakrdl",
  # The version of the snitch cluster relies on the rawheader 0.1
  "peakrdl-rawheader",
  "peakrdl-markdown",
  # Provides pkg_resources, needed by the lowRISC reggen regtool.py used for
  # iDMA/Cheshire RTL generation. A pip venv bundled it implicitly; uv does not.
  # Pin <81: setuptools >=81 removed pkg_resources.
  "setuptools<81",
]

[dependency-groups]
# SoC test framework (pytest front-end wrapping ctest) + tooling. Installed by
# default with `uv sync` (the `dev` group).
dev = ["pytest", "pytest-html", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = [
  "host: host-only tests (no cluster offload)",
  "cluster: tests that offload to a Snitch cluster",
]

[tool.setuptools]
packages = []
include-package-data = false
